name: llm-service

services:
  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_pass
      POSTGRES_DB: chat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.14.0
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # В образе нет wget/curl — проверка TCP, как в ДЗ 5.2.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
      DATABASE_URL: postgresql+asyncpg://chat_user:chat_pass@postgres:5432/chat_db
      BOT_URL: http://bot:9000
      QDRANT_URL: http://qdrant:6333
      AGENT_CHECKPOINTER: postgres
      NO_PROXY: localhost,127.0.0.1,redis,postgres,qdrant,phoenix,app,bot
      no_proxy: localhost,127.0.0.1,redis,postgres,qdrant,phoenix,app,bot
    volumes:
      - ./data:/app/data
      - ./var:/app/var
    depends_on:
      redis:
        condition: service_healthy
      phoenix:
        condition: service_started
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  bot:
    build: .
    command: ["python", "-m", "bot"]
    env_file:
      - .env
    environment:
      BACKEND_URL: http://app:8000
      BOT_URL: http://bot:9000
      NO_PROXY: localhost,127.0.0.1,redis,postgres,qdrant,phoenix,app,bot
      no_proxy: localhost,127.0.0.1,redis,postgres,qdrant,phoenix,app,bot
    ports:
      - "9000:9000"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  phoenix-data:
  postgres_data:
  qdrant_storage:
